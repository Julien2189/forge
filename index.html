<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FORGE — Programme sportif & chrono de récup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
 
</head>
<body>

<div class="wrap">
  <header class="app">
    <div class="brand">
      <span class="logo">FORGE</span>
      <span class="tag">Training</span>
    </div>
    <button class="btn-lib" id="openLib"><span class="dot"></span> Séances</button>
  </header>

  <div class="prog-name" id="progName">—</div>
  <div class="prog-sub" id="progSub">—</div>

  <div class="days" id="days"></div>

  <div class="day-head">
    <h2 id="dayTitle">—</h2>
    <div class="progress">
      <div class="lbl"><span>Progression du jour</span><b id="progPct">0%</b></div>
      <div class="bar"><i id="progFill"></i></div>
    </div>
  </div>

  <div class="ex-list" id="exList"></div>

  <button class="add-ex" id="addEx">＋ Ajouter un exercice</button>

  <div class="day-actions">
    <button class="reset-day" id="resetDay">↺ Réinitialiser le jour</button>
  </div>
</div>

<!-- Chrono dock -->
<div class="chrono" id="chrono">
  <div class="chrono-inner">
    <div class="ring-wrap">
      <svg width="74" height="74" viewBox="0 0 74 74">
        <circle class="ring-bg" cx="37" cy="37" r="32"></circle>
        <circle class="ring-fg" id="ringFg" cx="37" cy="37" r="32"></circle>
      </svg>
      <div class="ring-num" id="ringNum">0%</div>
    </div>
    <div class="chrono-mid">
      <div class="chrono-state" id="chronoState">Chrono prêt</div>
      <div class="chrono-time" id="chronoTime">00:00</div>
      <div class="chrono-from" id="chronoFrom">Valide une série ou touche “Repos” pour lancer la récup</div>
    </div>
    <div class="chrono-ctrl">
      <button class="cc" id="ccMinus" title="-15s">−15</button>
      <button class="cc play" id="ccPlay" title="Démarrer / Pause">▶</button>
      <button class="cc" id="ccPlus" title="+15s">+15</button>
      <button class="cc" id="ccReset" title="Réinitialiser">↺</button>
    </div>
  </div>
</div>

<!-- Library sheet -->
<div class="overlay" id="libOverlay">
  <div class="sheet">
    <div class="sheet-grab"></div>
    <h3>Suggestions de séances</h3>
    <p class="lead">Choisis un programme. Ta progression de chaque programme est sauvegardée séparément.</p>
    <div class="lib-grid" id="libGrid"></div>
  </div>
</div>

<!-- Add exercise sheet -->
<div class="overlay" id="addOverlay">
  <div class="sheet" style="max-width:520px">
    <div class="sheet-grab"></div>
    <h3>Nouvel exercice</h3>
    <p class="lead">Il sera ajouté à la séance du jour affiché.</p>
    <div class="form-row">
      <label for="fName">Nom de l'exercice</label>
      <input id="fName" type="text" placeholder="ex. Développé incliné" autocomplete="off">
    </div>
    <div class="form-row">
      <label for="fMuscle">Groupe musculaire</label>
      <input id="fMuscle" type="text" placeholder="ex. Pecs" autocomplete="off">
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label for="fSets">Séries</label>
        <input id="fSets" type="number" min="1" max="12" value="4">
      </div>
      <div class="form-row">
        <label for="fReps">Reps</label>
        <input id="fReps" type="text" value="10" placeholder="10 / 30s">
      </div>
      <div class="form-row">
        <label for="fRest">Récup (s)</label>
        <input id="fRest" type="number" min="0" max="600" step="5" value="90">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-ghost" id="addCancel">Annuler</button>
      <button class="btn-primary" id="addSave">Ajouter</button>
    </div>
  </div>
</div>

/* ============ ÉTAT & STOCKAGE ============ */
const LS_PROGRESS="forge_progress_v1";
const LS_ACTIVE="forge_active_v1";
const LS_CUSTOM="forge_custom_v1";

let store = load(LS_PROGRESS, {});       // { progId: { dayIdx: { exId: setsDone } } }
let custom = load(LS_CUSTOM, {});         // { progId: { dayIdx: [ {n,m,s,r,rest,id} ] } }
let active = load(LS_ACTIVE, {prog:"fullbody", day:0});

function load(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(){ localStorage.setItem(LS_PROGRESS,JSON.stringify(store));
  localStorage.setItem(LS_ACTIVE,JSON.stringify(active));
  localStorage.setItem(LS_CUSTOM,JSON.stringify(custom)); }

function curProgram(){ return PROGRAMS.find(p=>p.id===active.prog) || PROGRAMS[0]; }

/* exercices d'un jour = presets + customs */
function dayExercises(progId, dayIdx){
  const prog = PROGRAMS.find(p=>p.id===progId);
  const base = prog.days[dayIdx].ex.map((e,i)=>({...e, id:`p${i}`}));
  const cust = ((custom[progId]||{})[dayIdx]||[]);
  return base.concat(cust);
}
function setsDone(progId, dayIdx, exId){
  return (((store[progId]||{})[dayIdx]||{})[exId])||0;
}
function setSetsDone(progId, dayIdx, exId, val){
  store[progId]=store[progId]||{};
  store[progId][dayIdx]=store[progId][dayIdx]||{};
  store[progId][dayIdx][exId]=val;
  save();
}

/* ============ DOM ============ */
const $=id=>document.getElementById(id);

function dayCompletion(progId, dayIdx){
  const exs=dayExercises(progId, dayIdx);
  let total=0, done=0;
  exs.forEach(e=>{ total+=e.s; done+=Math.min(setsDone(progId,dayIdx,e.id), e.s); });
  return {total, done, pct: total? Math.round(done/total*100):0, exs};
}

function renderHeader(){
  const p=curProgram();
  $("progName").textContent=p.name;
  const nDays=p.days.length;
  $("progSub").innerHTML=`${nDays} séances · <b>récup auto au chrono</b> à chaque série validée`;
}

function renderDays(){
  const p=curProgram();
  const wrap=$("days"); wrap.innerHTML="";
  p.days.forEach((d,i)=>{
    const c=dayCompletion(p.id,i);
    const b=document.createElement("button");
    b.className="day-tab"+(i===active.day?" active":"")+(c.pct===100&&c.total>0?" done-day":"");
    b.innerHTML=`<div class="dnum">JOUR ${i+1}</div><div class="dname">${d.name}</div>
      <div class="dmeta">${c.exs.length} exos · ${c.pct}%</div>`;
    b.onclick=()=>{ active.day=i; save(); renderAll(); };
    wrap.appendChild(b);
  });
}

function renderDay(){
  const p=curProgram();
  const d=p.days[active.day];
  $("dayTitle").textContent=`Jour ${active.day+1} — ${d.name}`;
  const c=dayCompletion(p.id, active.day);
  $("progPct").textContent=c.pct+"%";
  $("progFill").style.width=c.pct+"%";

  const list=$("exList"); list.innerHTML="";
  c.exs.forEach(e=>{
    const done=setsDone(p.id,active.day,e.id);
    const isDone=done>=e.s;
    const card=document.createElement("div");
    card.className="ex"+(isDone?" done":"");

    let setsHtml=`<span class="set-label">Séries</span>`;
    for(let s=1;s<=e.s;s++){
      setsHtml+=`<button class="set${s<=done?" on":""}" data-ex="${e.id}" data-set="${s}">${s}</button>`;
    }
    setsHtml+=`<button class="ex-rest-btn" data-rest="${e.rest}" data-name="${e.n}">⏱ Repos ${fmt(e.rest)}</button>`;

    card.innerHTML=`
      <div class="ex-top">
        <div>
          <div class="ex-name">${e.n}</div>
          <div class="ex-meta">
            <span><b>${e.s}</b> séries</span>
            <span><b>${e.r}</b> reps</span>
            <span>récup <b>${fmt(e.rest)}</b></span>
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="ex-mtag">${e.m}</span>
          ${e.id.startsWith("c")?`<button class="ex-del" data-del="${e.id}" title="Supprimer">✕</button>`:""}
        </div>
      </div>
      <div class="sets">${setsHtml}</div>`;
    list.appendChild(card);
  });

  // events: séries
  list.querySelectorAll(".set").forEach(btn=>{
    btn.onclick=()=>{
      const exId=btn.dataset.ex, sNum=+btn.dataset.set;
      const cur=setsDone(p.id,active.day,exId);
      let nv;
      if(sNum<=cur){ nv=sNum-1; }            // décocher jusqu'à cette série
      else { nv=sNum; launchRestForEx(exId); } // cocher + lancer récup
      setSetsDone(p.id,active.day,exId,nv);
      renderDays(); renderDay();
    };
  });
  // events: bouton repos
  list.querySelectorAll(".ex-rest-btn").forEach(btn=>{
    btn.onclick=()=>startTimer(+btn.dataset.rest, btn.dataset.name);
  });
  // events: suppression custom
  list.querySelectorAll(".ex-del").forEach(btn=>{
    btn.onclick=()=>{
      const exId=btn.dataset.del;
      custom[p.id][active.day]=(custom[p.id][active.day]||[]).filter(x=>x.id!==exId);
      if(store[p.id]&&store[p.id][active.day]) delete store[p.id][active.day][exId];
      reindexCustom(p.id, active.day);
      save(); renderAll();
    };
  });
}

function launchRestForEx(exId){
  const p=curProgram();
  const e=dayExercises(p.id,active.day).find(x=>x.id===exId);
  if(e) startTimer(e.rest, e.n);
}

/* réindexe les ids custom après suppression pour rester cohérent */
function reindexCustom(progId, dayIdx){
  const arr=(custom[progId]||{})[dayIdx]||[];
  const oldProg=(store[progId]||{})[dayIdx]||{};
  const newProg={};
  // garde la progression des presets
  Object.keys(oldProg).forEach(k=>{ if(k.startsWith("p")) newProg[k]=oldProg[k]; });
  arr.forEach((item,i)=>{
    const newId="c"+i;
    if(oldProg[item.id]!=null) newProg[newId]=oldProg[item.id];
    item.id=newId;
  });
  if(store[progId]) store[progId][dayIdx]=newProg;
}

function renderAll(){ renderHeader(); renderDays(); renderDay(); }

/* ============ CHRONO ============ */
let timer={total:0, remaining:0, running:false, endAt:0, raf:null};
const R=32, CIRC=2*Math.PI*R;
$("ringFg").style.strokeDasharray=CIRC;
$("ringFg").style.strokeDashoffset=CIRC;

function fmt(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60),s=sec%60;
  return m>0? `${m}:${String(s).padStart(2,"0")}` : `${s}s`; }
function clock(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60),s=sec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }

function startTimer(seconds, fromName){
  if(!seconds||seconds<=0) seconds=60;
  timer.total=seconds; timer.remaining=seconds;
  if(fromName){ $("chronoFrom").textContent="Récup après · "+fromName; }
  resume();
}
function resume(){
  timer.running=true; timer.endAt=Date.now()+timer.remaining*1000;
  $("chrono").classList.add("resting");
  $("chronoState").textContent="Récupération";
  $("ccPlay").textContent="❚❚"; $("ccPlay").classList.remove("paused");
  ensureAudio();
  tick();
}
function pause(){
  timer.running=false; cancelAnimationFrame(timer.raf);
  $("ccPlay").textContent="▶"; $("ccPlay").classList.add("paused");
  $("chronoState").textContent="En pause";
}
function reset(){
  timer.running=false; cancelAnimationFrame(timer.raf);
  timer.remaining=timer.total;
  $("chrono").classList.remove("resting");
  $("ccPlay").textContent="▶"; $("ccPlay").classList.remove("paused");
  $("chronoState").textContent=timer.total?"Chrono prêt":"Chrono prêt";
  $("chronoFrom").textContent="Valide une série ou touche “Repos” pour lancer la récup";
  draw();
}
function tick(){
  timer.remaining=Math.max(0,(timer.endAt-Date.now())/1000);
  draw();
  if(timer.remaining<=0){ finish(); return; }
  timer.raf=requestAnimationFrame(tick);
}
function finish(){
  timer.running=false; cancelAnimationFrame(timer.raf);
  timer.remaining=0; draw();
  $("chronoState").textContent="Récup terminée — go !";
  $("ccPlay").textContent="▶"; $("ccPlay").classList.add("paused");
  beep(); vibrate([200,80,200,80,300]);
  $("chrono").classList.remove("resting");
}
function draw(){
  $("chronoTime").textContent=clock(timer.remaining);
  const pct = timer.total? timer.remaining/timer.total : 0;
  $("ringFg").style.strokeDashoffset = CIRC*(1-pct);
  $("ringNum").textContent = Math.round(timer.remaining)+"";
}

$("ccPlay").onclick=()=>{
  if(timer.running) pause();
  else { if(timer.remaining<=0) timer.remaining=timer.total||60; resume(); }
};
$("ccReset").onclick=reset;
$("ccPlus").onclick=()=>{ adjust(15); };
$("ccMinus").onclick=()=>{ adjust(-15); };
function adjust(d){
  timer.remaining=Math.max(0,timer.remaining+d);
  timer.total=Math.max(timer.total, timer.remaining);
  if(timer.running) timer.endAt=Date.now()+timer.remaining*1000;
  draw();
}

/* son + vibration */
let actx=null;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx&&actx.state==="suspended") actx.resume(); }
function beep(){
  if(!actx) return;
  const now=actx.currentTime;
  [880,1175,880].forEach((f,i)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="sine"; o.frequency.value=f;
    o.connect(g); g.connect(actx.destination);
    const t=now+i*0.22;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+0.02);
    g.gain.exponentialRampToValueAtTime(.001,t+0.2);
    o.start(t); o.stop(t+0.22);
  });
}
function vibrate(p){ if(navigator.vibrate) navigator.vibrate(p); }

/* ============ LIBRARY ============ */
function renderLib(){
  const grid=$("libGrid"); grid.innerHTML="";
  PROGRAMS.forEach(p=>{
    const totalEx=p.days.reduce((a,d)=>a+d.ex.length,0);
    const card=document.createElement("button");
    card.className="lib-card"+(p.id===active.prog?" current":"");
    card.innerHTML=`
      <h4>${p.name} ${p.id===active.prog?`<span class="badge">en cours</span>`:""}</h4>
      <div class="desc">${p.desc}</div>
      <div class="pills">
        <span class="pill">${p.days.length} séances</span>
        <span class="pill">${totalEx} exercices</span>
        ${p.days.map(d=>`<span class="pill">${d.name}</span>`).join("")}
      </div>`;
    card.onclick=()=>{ active.prog=p.id; active.day=0; save(); closeOverlay("libOverlay"); renderAll(); };
    grid.appendChild(card);
  });
}
$("openLib").onclick=()=>{ renderLib(); openOverlay("libOverlay"); };

/* ============ ADD EXERCISE ============ */
$("addEx").onclick=()=>{ openOverlay("addOverlay"); setTimeout(()=>$("fName").focus(),60); };
$("addCancel").onclick=()=>closeOverlay("addOverlay");
$("addSave").onclick=()=>{
  const n=$("fName").value.trim();
  if(!n){ $("fName").focus(); return; }
  const p=curProgram();
  custom[p.id]=custom[p.id]||{};
  custom[p.id][active.day]=custom[p.id][active.day]||[];
  const arr=custom[p.id][active.day];
  arr.push({
    n, m:($("fMuscle").value.trim()||"Perso"),
    s:Math.max(1,parseInt($("fSets").value)||3),
    r:$("fReps").value.trim()||"10",
    rest:Math.max(0,parseInt($("fRest").value)||90),
    id:"c"+arr.length
  });
  save();
  $("fName").value=""; $("fMuscle").value="";
  closeOverlay("addOverlay");
  renderAll();
};

/* ============ RESET DAY ============ */
$("resetDay").onclick=()=>{
  const p=curProgram();
  if(store[p.id]&&store[p.id][active.day]){
    // ne garde rien : remet à zéro la progression du jour
    const keep={};
    Object.keys(store[p.id][active.day]).forEach(k=>{ keep[k]=0; });
    store[p.id][active.day]=keep;
    save(); renderAll();
  }
};

/* ============ OVERLAY HELPERS ============ */
function openOverlay(id){ $(id).classList.add("open"); }
function closeOverlay(id){ $(id).classList.remove("open"); }
document.querySelectorAll(".overlay").forEach(ov=>{
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.classList.remove("open"); });
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.querySelectorAll(".overlay.open").forEach(o=>o.classList.remove("open")); });

/* ============ INIT ============ */
if(!PROGRAMS.find(p=>p.id===active.prog)) active.prog=PROGRAMS[0].id;
if(active.day>=curProgram().days.length) active.day=0;
reset();
renderAll();
</script>
</body>
</html>
